<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register</title>
    </head>
    <body>
        <main>
            <h1>Create an account</h1>

            <form id="register-form">
                <div>
                    <label for="name">Username:</label>
                    <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    autocomplete="username" a
                    ria-describedby="name-help" 
                    required/>
                    <p id="name-help">Your username must contain letters, numbers and underscores.</p>
                </div>

                <div>
                    <label for="email">Student Email:</label>
                    <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    autocomplete="email" 
                    aria-describedby="email-help" 
                    required/>
                    <p id="email-help">Please enter your @stud.noroff.no email address.</p>
                </div>

                <div>
                    <label for="password">Password:</label>
                    <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    autocomplete="new-password" 
                    minlength="8"
                    aria-describedby="password-help" 
                    required/>
                    <p id="password-help">Your password must be at least 8 characters long.</p>
                </div>

                <button type="submit" disabled>Register</button>
                <p id="register-message" role="status"></p>
            </form>

            <p>Already have an account? <a href="login.html">Log in</a></p>
        </main>
    </body>
</html>
